name: Splice a patch into a rendered video
# Push splice.json: {"base": "<release tag>", "patch": "<release tag of a range render>", "frames": [first, last],
#  "composition": "PhoneIf"}. Frames first..last of the base video are replaced by the patch video (same length),
# the base audio is kept, and the result is released as <composition>-<date>-patch.
on:
  push:
    branches: [main]
    paths: [splice.json]
permissions:
  contents: write
jobs:
  splice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: splice.json, sparse-checkout-cone-mode: false }
      - name: Splice
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          read BASE PATCH A B C < <(python3 -c "import json;c=json.load(open('splice.json'));print(c['base'],c['patch'],c['frames'][0],c['frames'][1],c['composition'])")
          gh release download "$BASE" -p "$C.mp4" -O base.mp4 --repo "${{ github.repository }}"
          gh release download "$PATCH" -p "$C.mp4" -O patch.mp4 --repo "${{ github.repository }}"
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          N() { ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$1"; }
          TOT=$(N base.mp4); PN=$(N patch.mp4)
          [ "$PN" -eq $((B - A + 1)) ] || { echo "patch has $PN frames, range needs $((B - A + 1))"; exit 1; }
          E="-c:v libx264 -crf 16 -preset medium -pix_fmt yuv420p -an -video_track_timescale 15360"
          # a patch that starts at frame 0 has no "before" part (an empty a.mp4 breaks the concat)
          if [ "$A" -gt 0 ]; then ffmpeg -loglevel error -y -i base.mp4 -vf "trim=end_frame=$A,setpts=PTS-STARTPTS" $E a.mp4; fi
          ffmpeg -loglevel error -y -i patch.mp4 -vf "setpts=PTS-STARTPTS" $E b.mp4
          ffmpeg -loglevel error -y -i base.mp4 -vf "trim=start_frame=$((B + 1)),setpts=PTS-STARTPTS" $E c.mp4
          { [ "$A" -gt 0 ] && echo "file a.mp4"; echo "file b.mp4"; echo "file c.mp4"; } > list.txt
          ffmpeg -loglevel error -y -f concat -safe 0 -i list.txt -i base.mp4 -map 0:v -map 1:a -c copy -movflags +faststart "$C.mp4"
          OUT=$(N "$C.mp4"); [ "$OUT" -eq "$TOT" ] || { echo "spliced video has $OUT frames, base has $TOT"; exit 1; }
          TAG="$C-$(date -u +%Y%m%d-%H%M)-patch"
          printf "Release %s with frames %s-%s replaced by release %s. Audio from %s. %s frames.\n" "$BASE" "$A" "$B" "$PATCH" "$BASE" "$OUT" > notes.md
          gh release create "$TAG" "$C.mp4" --title "$TAG" --notes-file notes.md --repo "${{ github.repository }}"
          echo "Released $TAG ($OUT frames)" >> $GITHUB_STEP_SUMMARY
