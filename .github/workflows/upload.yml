name: Upload to YouTube
# Push upload.json (see PRODUCTION.md, "Uploading"). The video is uploaded PRIVATE; with
# "publishAt" set, YouTube makes it public at that time.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [upload.json]
permissions:
  contents: write
concurrency:
  group: youtube-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read upload.json
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("upload.json", encoding="utf-8"))
          ch = c.get("channel", "")
          if ch not in ("shorts", "explained"):
              raise SystemExit('upload.json "channel" must be "shorts" (Paradox Town) or "explained" (Paradox Town Explained)')
          print(f"release={c['release']}")
          print(f"asset={c.get('asset') or c['release'].split('-')[0] + '.mp4'}")
          print(f"thumbnail={c.get('thumbnail', '')}")
          print(f"channel={ch}")
          print(f"force={'true' if c.get('force') else 'false'}")
          PY
      - name: Stop if this release was already uploaded to this channel
        if: steps.cfg.outputs.force != 'true' && steps.cfg.outputs.release != 'test'
        run: |
          KEY="${{ steps.cfg.outputs.channel }} ${{ steps.cfg.outputs.release }}"
          if [ -f uploads.log ] && grep -q "^$KEY " uploads.log; then
            echo "Already uploaded: $(grep "^$KEY " uploads.log). Add \"force\": true to upload it again." | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - name: Download the video (and thumbnail) from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.cfg.outputs.release }}" = "test" ]; then
            # "release": "test" uploads a 5 s generated clip, to check a channel's token
            sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
            ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 \
              -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac video.mp4
            ls -l video.mp4; exit 0
          fi
          gh release download "${{ steps.cfg.outputs.release }}" --repo "${{ github.repository }}" \
            -p "${{ steps.cfg.outputs.asset }}" -O video.mp4
          ls -l video.mp4
          T="${{ steps.cfg.outputs.thumbnail }}"
          if [ -n "$T" ]; then
            if [ -f "$T" ]; then cp "$T" thumb.jpg
            else gh release download "${{ steps.cfg.outputs.release }}" --repo "${{ github.repository }}" -p "$T" -O thumb.jpg; fi
            ls -l thumb.jpg
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet google-api-python-client google-auth
      - name: Upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ steps.cfg.outputs.channel == 'shorts' && secrets.YT_REFRESH_SHORTS || secrets.YT_REFRESH_EXPLAINED }}
        run: |
          if [ -z "$YT_CLIENT_ID" ] || [ -z "$YT_CLIENT_SECRET" ] || [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "Missing YouTube secrets for channel ${{ steps.cfg.outputs.channel }}" | tee -a $GITHUB_STEP_SUMMARY; exit 1
          fi
          python scripts/youtube_upload.py upload.json video.mp4 "$( [ -f thumb.jpg ] && echo thumb.jpg )"
      - name: Record the upload
        if: success() && steps.cfg.outputs.release != 'test'
        run: |
          VID=$(python3 -c "import json;print(json.load(open('upload-result.json'))['videoId'])")
          echo "${{ steps.cfg.outputs.channel }} ${{ steps.cfg.outputs.release }} https://youtu.be/$VID $(date -u +%Y-%m-%dT%H:%MZ)" >> uploads.log
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add uploads.log
          if [ -f pending-comments.json ]; then git add pending-comments.json; fi
          git commit -m "Uploaded ${{ steps.cfg.outputs.release }} to YouTube ($VID)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
