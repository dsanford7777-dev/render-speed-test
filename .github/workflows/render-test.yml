name: Render speed test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Machine info
        run: |
          echo "## Machine" >> $GITHUB_STEP_SUMMARY
          echo "- CPUs: $(nproc)" >> $GITHUB_STEP_SUMMARY
          echo "- RAM: $(free -g | awk '/Mem:/{print $2}') GB" >> $GITHUB_STEP_SUMMARY
      - name: Blank-frame check (stills are the first frame a tab renders)
        if: always()
        run: |
          mkdir -p out
          for f in 0 300 1200; do npx remotion still src/index.ts BridgeShort out/still_$f.png --frame=$f --scale=0.5 --gl=swangle --timeout=300000 > out/still_$f.txt 2>&1 || echo FAIL >> out/still_$f.txt; done
      - name: Save results to the results branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp out/*.txt out/*.png /tmp/res/ 2>/dev/null || true
          ls -la out > /tmp/res/files.txt 2>&1 || true
          nproc > /tmp/res/cpus.txt
          cd /tmp/res && git init -q -b results && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Render test results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-test
          path: out/
