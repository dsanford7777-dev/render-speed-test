name: Render speed test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Machine info
        run: |
          echo "## Machine" >> $GITHUB_STEP_SUMMARY
          echo "- CPUs: $(nproc)" >> $GITHUB_STEP_SUMMARY
          echo "- RAM: $(free -g | awk '/Mem:/{print $2}') GB" >> $GITHUB_STEP_SUMMARY
      - name: Diagnostics (cube + scene stills under each GL mode)
        if: always()
        run: |
          mkdir -p out
          for gl in swangle angle swiftshader egl; do
            npx remotion still src/index.ts Cube out/cube_$gl.png --frame=10 --scale=0.25 --gl=$gl --timeout=300000 > out/cube_$gl.txt 2>&1 || echo FAIL >> out/cube_$gl.txt
            npx remotion still src/index.ts BridgeShort out/scene_$gl.png --frame=300 --scale=0.5 --gl=$gl --timeout=300000 --log=verbose > out/scene_$gl.txt 2>&1 || echo FAIL >> out/scene_$gl.txt
          done
      - name: Render 60 frames (2 s) at 1080x1920
        if: always()
        run: |
          set -o pipefail
          START=$(date +%s)
          npx remotion render src/index.ts BridgeShort out/test.mp4 --frames=300-359 --codec=h264 --crf=16 --gl=swangle --timeout=600000 2>&1 | tee out/render-log.txt | tail -20
          END=$(date +%s)
          echo "$((END-START))" > out/render-seconds.txt
      - name: Save results to the results branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp out/*.txt out/*.png out/*.mp4 /tmp/res/ 2>/dev/null || true
          ls -la out > /tmp/res/files.txt 2>&1 || true
          nproc > /tmp/res/cpus.txt
          cd /tmp/res && git init -q -b results && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Render test results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-test
          path: out/
