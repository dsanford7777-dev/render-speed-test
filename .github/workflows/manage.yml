name: Edit or delete uploaded videos
# Push manage.json (see scripts/youtube_manage.py): replace text in a description, or delete a video
# (only when its current title matches the one given).
on:
  push:
    branches: [main]
    paths: [manage.json]
permissions:
  contents: read
concurrency:
  group: youtube-upload
  cancel-in-progress: false
jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Apply manage.json
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_SHORTS: ${{ secrets.YT_REFRESH_SHORTS }}
          YT_REFRESH_EXPLAINED: ${{ secrets.YT_REFRESH_EXPLAINED }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python scripts/youtube_manage.py
