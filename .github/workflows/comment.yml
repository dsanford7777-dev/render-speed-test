name: Post queued YouTube comments
# Comments can't be posted on private videos, so upload.yml queues them in pending-comments.json
# and this posts each one once its video is public.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: youtube-upload
  cancel-in-progress: false
jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: |
          N=$(python3 -c "import json,os;print(len(json.load(open('pending-comments.json'))) if os.path.exists('pending-comments.json') else 0)")
          echo "n=$N" >> "$GITHUB_OUTPUT"; echo "queued: $N"
      - uses: actions/setup-python@v5
        if: steps.q.outputs.n != '0'
        with: { python-version: "3.12" }
      - name: Post comments
        if: steps.q.outputs.n != '0'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_SHORTS: ${{ secrets.YT_REFRESH_SHORTS }}
          YT_REFRESH_EXPLAINED: ${{ secrets.YT_REFRESH_EXPLAINED }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python scripts/youtube_comment.py
      - name: Save the queue
        if: always() && steps.q.outputs.n != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pending-comments.json
          git diff --cached --quiet && exit 0
          git commit -m "Update queued YouTube comments"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
