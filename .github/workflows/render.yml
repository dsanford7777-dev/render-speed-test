name: Render short
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [render.json]
permissions:
  contents: write
env:
  PAD: 2            # keep in step with PAD in src/Root.tsx
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      composition: ${{ steps.p.outputs.composition }}
      total: ${{ steps.p.outputs.total }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - id: p
        run: |
          COMP=$(node -e "console.log(JSON.parse(require('fs').readFileSync('render.json','utf8')).composition)")
          npx remotion compositions src/index.ts --gl=swangle 2>&1 | tee comps.txt
          TOTAL=$(sed 's/\x1b\[[0-9;]*m//g' comps.txt | awk -v c="$COMP" '$1==c {print $4}')
          echo "frames for $COMP: $TOTAL"
          node scripts/plan.mjs "$TOTAL"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Render chunk ${{ matrix.i }} (frames ${{ matrix.a }}-${{ matrix.b }})
        run: |
          set -o pipefail
          # Padded composition: padded frame p shows real frame p-PAD. Rendering padded a..b+PAD gives
          # PAD warm-up frames (dropped at stitch) followed by real frames a..b.
          START=$(date +%s)
          npx remotion render src/index.ts "${{ needs.plan.outputs.composition }}Padded" chunk.mp4 \
            --frames=${{ matrix.a }}-$(( ${{ matrix.b }} + PAD )) --concurrency=$PAD \
            --codec=h264 --crf=12 --gl=swangle --timeout=600000 2>&1 | grep -v -E "404|THREE.Clock" | tail -15
          echo "chunk ${{ matrix.i }} (frames ${{ matrix.a }}-${{ matrix.b }}): $(( $(date +%s) - START )) s" | tee time.txt
          mkdir -p part && mv chunk.mp4 part/chunk_$(printf %02d ${{ matrix.i }}).mp4 && mv time.txt part/time_$(printf %02d ${{ matrix.i }}).txt
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: part/
          retention-days: 2

  stitch:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: chunk-*, merge-multiple: true, path: parts }
      - name: Join chunks (drop warm-up frames) and check for blank frames
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          cd parts && ls -la
          IN=""; FC=""; N=0
          for f in $(ls chunk_*.mp4 | sort); do
            IN="$IN -i $f"; FC="$FC[$N:v]trim=start_frame=$PAD,setpts=PTS-STARTPTS[v$N];"; N=$((N+1))
          done
          CAT=$(for k in $(seq 0 $((N-1))); do printf "[v$k]"; done)
          ffmpeg -loglevel error -y $IN -filter_complex "${FC}${CAT}concat=n=$N:v=1:a=0[out]" -map "[out]" \
            -c:v libx264 -crf 16 -preset medium -pix_fmt yuv420p -movflags +faststart ../video.mp4
          cd ..
          FRAMES=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 video.mp4)
          # blank frame = almost no brightness range (the empty sky colour)
          ffmpeg -loglevel error -i video.mp4 -vf "scale=108:192,signalstats,metadata=print:file=stats.txt" -f null -
          BLANK=$(awk -F= '/YLOW=/{l=$2} /YHIGH=/{if($2-l<12) b++} END{print b+0}' stats.txt)
          {
            echo "## Render"
            echo "- Frames: $FRAMES (expected ${{ needs.plan.outputs.total }})"
            echo "- Blank frames found: $BLANK"
            echo "- Chunk times:"; cat parts/time_*.txt | sed 's/^/  - /'
          } | tee report.md >> $GITHUB_STEP_SUMMARY
      - name: Publish to the renders branch
        run: |
          mkdir -p /tmp/pub && cp video.mp4 /tmp/pub/${{ needs.plan.outputs.composition }}.mp4 && cp report.md /tmp/pub/report.md
          cd /tmp/pub && git init -q -b renders && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Render ${{ needs.plan.outputs.composition }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" renders
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            video.mp4
            report.md
