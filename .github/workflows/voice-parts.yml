name: Fetch voice parts
# For long-form videos whose narration was generated in several parts (ElevenLabs caps one take at 5,000 characters).
# Push public/<video>/voice-parts.json  { "urls": [...], "gap": 0.6, "max_pause": 0.6 }  and this downloads every part,
# keeps the raw parts (public/<video>/parts/partN.mp3) so one chapter can be re-recorded later, joins them with a
# short gap, trims over-long pauses, loudness-normalises, and commits public/<video>/voice.mp3.
# It does not align or render: run "Align to voice" for that once the composition exists.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/*/voice-parts.json"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - run: sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg jq >/dev/null
      - name: Download, join, tidy
        run: |
          set -e
          for src in $(git diff --name-only HEAD~1 HEAD -- 'public/*/voice-parts.json'); do
            d=$(dirname "$src"); mkdir -p "$d/parts"
            GAP=$(jq -r '.gap // 0.6' "$src"); PAUSE=$(jq -r '.max_pause // 0.6' "$src")
            : > list.txt; i=0
            ffmpeg -loglevel error -y -f lavfi -i anullsrc=r=44100:cl=mono -t "$GAP" -ar 44100 -ac 1 gap.wav
            for url in $(jq -r '.urls[]' "$src"); do
              i=$((i+1))
              curl -sSfL -o "$d/parts/part$i.mp3" "$url"
              ffmpeg -loglevel error -y -i "$d/parts/part$i.mp3" -ar 44100 -ac 1 "p$i.wav"
              [ $i -gt 1 ] && echo "file 'gap.wav'" >> list.txt
              echo "file 'p$i.wav'" >> list.txt
              echo "part $i: $(ffprobe -v error -show_entries format=duration -of csv=p=0 $d/parts/part$i.mp3)s" | tee -a $GITHUB_STEP_SUMMARY
            done
            ffmpeg -loglevel error -y -f concat -safe 0 -i list.txt joined.wav
            ffmpeg -loglevel error -y -i joined.wav -af "silenceremove=stop_periods=-1:stop_duration=$PAUSE:stop_threshold=-35dB:detection=rms:stop_silence=$PAUSE,loudnorm=I=-14:TP=-1.5:LRA=11" -ar 44100 -b:a 192k "$d/voice.mp3"
            echo "$d/voice.mp3: $(ffprobe -v error -show_entries format=duration -of csv=p=0 $d/voice.mp3)s" | tee -a $GITHUB_STEP_SUMMARY
            # the signed URLs expire within hours: drop them once the audio is saved
            git rm -q "$src"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A public && git commit -m "Fetch long-form voice parts" && git push
