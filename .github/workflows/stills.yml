name: Preview stills
on:
  push:
    branches: [main]
    paths: [stills.json]
permissions:
  contents: write
jobs:
  still:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Render this part's frames
        run: |
          FR=$(jq -r --argjson p ${{ matrix.part }} '[.frames | to_entries[] | select(.key % 6 == $p) | .value | tostring] | join(",")' stills.json)
          echo "frames: $FR"
          mkdir -p out
          if [ -n "$FR" ]; then node scripts/stills.mjs "$(jq -r .composition stills.json)" "$(jq -r .scale stills.json)" "$FR" out 2>&1 | grep -v -E "404|THREE.Clock" | tail -40; fi
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: stills-${{ matrix.part }}
          path: out/
          retention-days: 2
  publish:
    needs: still
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: stills-*, merge-multiple: true, path: s }
      - run: |
          mkdir -p s && cd s && ls -la
          git init -q -b stills && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Preview stills ${{ github.sha }}" --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stills
