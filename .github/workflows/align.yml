name: Align to voice
# Push public/<short>/voice.mp3 and this re-times src/videos/<short>/timeline.ts to the real narration
# (shot cuts, camera moves and subtitles all follow), commits it, then starts the full render with the voice.
on:
  workflow_dispatch:
    inputs:
      short: { description: "folder name, e.g. fahrenheit", required: true }
      render: { description: "start the full render after aligning", type: boolean, default: true }
  push:
    branches: [main]
    paths: ["public/*/voice.mp3", "public/*/voice-source.json"]
permissions:
  contents: write
  actions: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q faster-whisper==1.1.1 requests && sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg jq >/dev/null
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - name: Fetch and tighten the voice (voice-source.json -> voice.mp3)
        run: |
          set -e
          for src in $(git diff --name-only HEAD~1 HEAD -- 'public/*/voice-source.json'); do
            d=$(dirname "$src"); URL=$(jq -r .url "$src"); TARGET=$(jq -r '.target_seconds // 0' "$src"); PAUSE=$(jq -r '.max_pause // 0.3' "$src")
            curl -sSfL -o raw.mp3 "$URL"
            # shorten long pauses, then speed up (pitch kept) toward the target length, at most 1.3x
            ffmpeg -loglevel error -y -i raw.mp3 -af "silenceremove=stop_periods=-1:stop_duration=$PAUSE:stop_threshold=-35dB:detection=rms:stop_silence=$PAUSE" tight.wav
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 tight.wav)
            T=$(python3 -c "print(1.0 if $TARGET<=0 else min(1.3,max(1.0,$DUR/$TARGET)))")
            ffmpeg -loglevel error -y -i tight.wav -af "atempo=$T,loudnorm=I=-14:TP=-1.5:LRA=11" -ar 44100 -b:a 192k "$d/voice.mp3"
            echo "$src: raw $(ffprobe -v error -show_entries format=duration -of csv=p=0 raw.mp3)s, pauses cut to ${DUR}s, tempo $T -> $(ffprobe -v error -show_entries format=duration -of csv=p=0 $d/voice.mp3)s" | tee -a $GITHUB_STEP_SUMMARY align.log
            git rm -q "$src"
          done
      - name: Align
        run: |
          set -eo pipefail
          if [ -n "${{ inputs.short }}" ]; then SHORTS="${{ inputs.short }}"; else
            SHORTS=$(git diff --name-only HEAD~1 HEAD -- 'public/*/voice.mp3' 'public/*/voice-source.json' | cut -d/ -f2 | sort -u); fi
          for s in $SHORTS; do
            echo "== $s"; python scripts/align.py "public/$s/voice.mp3" "src/videos/$s/timeline.ts" 2>&1 | tee -a align.log
            COMP=$(grep -o "id=\"[A-Za-z]*\"" src/Root.tsx | cut -d'"' -f2 | grep -ix "$s" | head -1)
            if [ "${{ inputs.render }}" != "false" ]; then
              printf '{ "composition": "%s", "chunks": 10, "note": "aligned to voice" }\n' "$COMP" > render.json
            fi
          done
          if [ "${{ inputs.render }}" = "false" ]; then MSG="Align $SHORTS to the voice (no render)"; else MSG="Align $SHORTS to the voice and render"; fi
          git add -A src public render.json && git commit -m "$MSG" && git push
      - name: Start the render
        if: ${{ inputs.render != false }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run render.yml --ref main --repo "${{ github.repository }}"
      - name: Save the log to the logs branch
        if: always()
        run: |
          cp align.log /tmp/align.log 2>/dev/null || echo "no log" > /tmp/align.log
          git fetch -q origin logs || true
          git checkout -q -B logs
          git rm -rq --cached . >/dev/null; cp /tmp/align.log align.log
          git add align.log && git commit -qm "align log ${{ github.run_id }}" && git push -qf origin logs
