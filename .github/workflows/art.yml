name: Channel art
# Push art.json ({ "comps": ["Banner", "Avatar"] }) to render channel art PNGs to the `art` branch.
on:
  push:
    branches: [main]
    paths: [art.json]
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          set -o pipefail
          node scripts/art.mjs out $(jq -r '.comps | join(" ")' art.json) 2>&1 | grep -v -E "404|THREE.Clock" | tail -20
          ls -la out
      - run: |
          cd out && git init -q -b art && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Channel art ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" art
